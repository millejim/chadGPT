<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad Jokes Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 50px 40px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            color: #999;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .setup {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
            min-height: 30px;
        }
        
        .punchline {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            min-height: 40px;
            transition: all 0.3s ease;
        }
        
        .punchline.hidden {
            color: #f5f7fa;
            cursor: pointer;
        }
        
        .punchline.hidden:hover {
            transform: scale(1.05);
        }
        
        .reveal-hint {
            font-size: 0.9em;
            color: #999;
            margin-top: 10px;
            font-style: italic;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            padding: 12px 30px;
            font-size: 1em;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 140px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        .counter {
            color: #999;
            font-size: 0.95em;
            margin-bottom: 20px;
        }
        
        .loading {
            display: none;
            color: #667eea;
            font-weight: 600;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .nav-link {
            margin-top: 20px;
        }
        
        .nav-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        .nav-link a:hover {
            color: #764ba2;
        }
        
        .joke-stats {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Dad Jokes Generator</h1>
        <p class="subtitle">Get your daily dose of terrible jokes!</p>
        
        <div class="error" id="error-message"></div>
        <div class="loading" id="loading">Loading joke...</div>
        
        <div class="joke-container" id="joke-container">
            <div class="setup" id="setup">Why don't scientists trust atoms?</div>
            <div class="punchline hidden" id="punchline" onclick="togglePunchline()">Click to reveal</div>
            <div class="reveal-hint" id="reveal-hint">Click the punchline to reveal the joke</div>
        </div>
        
        <div class="counter">
            <span id="joke-count">Joke 1 of</span> <span id="total-jokes">20</span>
        </div>
        
        <div class="button-group">
            <button class="btn-primary" onclick="getRandomJoke()">Get Random Joke 🎲</button>
            <button class="btn-secondary" onclick="showAllJokes()">View All Jokes 📚</button>
        </div>
        
        <div class="joke-stats">
            <div>✨ Pro tip: Click the punchline to reveal the joke</div>
        </div>
        
        <div class="nav-link">
            <a href="{{ url_prefix }}/chat/">← Back to Chat</a>
        </div>
    </div>
    
    <script>
        let currentJoke = null;
        let totalJokes = 0;
        let punchlineRevealed = false;
        
        // Load initial joke on page load
        document.addEventListener('DOMContentLoaded', function() {
            getRandomJoke();
        });
        
        async function getRandomJoke() {
            try {
                showLoading(true);
                hideError();
                
                const response = await fetch('{{ url_prefix }}/backend-api/dad-jokes/random');
                const data = await response.json();
                
                if (data.success) {
                    currentJoke = data.joke;
                    totalJokes = data.total_jokes;
                    displayJoke(currentJoke);
                    updateCounter();
                } else {
                    showError('Failed to load joke: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to the server. ' + error.message);
            } finally {
                showLoading(false);
            }
        }
        
        function displayJoke(joke) {
            const setupEl = document.getElementById('setup');
            const punchlineEl = document.getElementById('punchline');
            const revealHintEl = document.getElementById('reveal-hint');
            
            setupEl.textContent = joke.setup;
            punchlineEl.textContent = joke.punchline;
            punchlineEl.classList.add('hidden');
            revealHintEl.style.display = 'block';
            punchlineRevealed = false;
        }
        
        function togglePunchline() {
            const punchlineEl = document.getElementById('punchline');
            const revealHintEl = document.getElementById('reveal-hint');
            
            if (punchlineEl.classList.contains('hidden')) {
                punchlineEl.classList.remove('hidden');
                revealHintEl.style.display = 'none';
                punchlineRevealed = true;
            } else {
                punchlineEl.classList.add('hidden');
                revealHintEl.style.display = 'block';
                punchlineRevealed = false;
            }
        }
        
        function updateCounter() {
            const counterEl = document.getElementById('joke-count');
            const totalEl = document.getElementById('total-jokes');
            totalEl.textContent = totalJokes;
            counterEl.textContent = '💡 Joke collection: ';
        }
        
        async function showAllJokes() {
            try {
                showLoading(true);
                hideError();
                
                const response = await fetch('{{ url_prefix }}/backend-api/dad-jokes/all');
                const data = await response.json();
                
                if (data.success) {
                    displayAllJokes(data.jokes);
                } else {
                    showError('Failed to load jokes: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Failed to connect to the server.');
            } finally {
                showLoading(false);
            }
        }
        
        function displayAllJokes(jokes) {
            const container = document.getElementById('joke-container');
            const jokesHtml = jokes.map((joke, index) => `
                <div style="text-align: left; margin-bottom: 20px; padding: 15px; background: #f9f9f9; border-radius: 10px; border-left: 4px solid #667eea;">
                    <div style="font-weight: 600; color: #667eea; margin-bottom: 8px;">Joke ${index + 1}</div>
                    <div style="margin-bottom: 8px;"><strong>${joke.setup}</strong></div>
                    <div style="color: #666; font-style: italic;">${joke.punchline}</div>
                </div>
            `).join('');
            
            container.innerHTML = `
                <div style="text-align: left;">
                    <div style="margin-bottom: 20px; font-weight: 600; font-size: 1.2em; color: #333;">All Jokes (${jokes.length})</div>
                    ${jokesHtml}
                </div>
            `;
            
            // Change button to go back
            document.querySelectorAll('.btn-primary')[0].textContent = 'Get Random Joke 🎲';
            document.querySelectorAll('.btn-primary')[0].onclick = getRandomJoke;
        }
        
        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }
        
        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }
        
        function hideError() {
            document.getElementById('error-message').style.display = 'none';
        }
    </script>
</body>
</html>

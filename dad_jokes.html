<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dad Jokes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
        }
        .joke-container {
            background-color: white;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .joke-number {
            color: #666;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .joke-text {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
        }
    </style>
</head>
<body>
    <h1>Dad Jokes Collection</h1>
    
    <div class="joke-container">
        <div class="joke-number">Joke #1</div>
        <div class="joke-text">
            Why don't scientists trust atoms?<br>
            Because they make up everything!
        </div>
    </div>
    
    <div class="joke-container">
        <div class="joke-number">Joke #2</div>
        <div class="joke-text">
            I'm reading a book about anti-gravity.<br>
            It's impossible to put down!
        </div>
    </div>
</body>
</html>
